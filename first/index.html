<script>
document.getElementById("cslider").innerText = `You are ${document.getElementById("csl").value}% cool.`;


        document.getElementById("csl").addEventListener("input",(event)=>{

    const dragBox = document.getElementById("dragBox");

    dragBox.addEventListener("mousedown", (e) => {
       
        

        function onMouseMove(event) {
            dragBox.style.left = (event.clientX-75) + "px";
            dragBox.style.top = (event.clientY-55*(window.scrollY/1000)) + "px";
        }

        window.addEventListener("mousemove", onMouseMove);

        window.addEventListener("mouseup", () => {
            window.removeEventListener("mousemove", onMouseMove);
        }, { once: true });
    });

    document.getElementById("yesT").addEventListener("click", yesClicked);
    document.getElementById("noT").addEventListener("click", noClicked);
    
    function yesClicked() {

    let clicks = 0;
    const buttonClicked = () => {

    function checkPass(){
        if(document.getElementById("passwordText").value === "rishu"){

        }
    }
    document.querySelector("h1").addEventListener("click",()=>{
        document.querySelector("h1").remove();
    })
    function downloadPdf(){
        let pdf = new jspdf.jsPDF();
        let text = document.getElementById("s1").value;
        let fontSize = Number(document.getElementById("fontSize").value);

        pdf.setFontSize(fontSize);
        let lines = pdf.splitTextToSize(text, 180);
        let y = 20;
        let lineHeight = fontSize * 0.5;

        for (let line of lines) {
            if (y > 280) {
                pdf.addPage();
                y = 20;
            }
            pdf.text(line, 10, y);
            y += lineHeight;
        }
        pdf.save(document.getElementById("fileName").value);
    }
</script>
